[project]
name = "ai-assisted-visual-production-playbook"
version = "2.2.1"
description = "Method and tested tools for producing 3D renders, animations and web background videos with an AI coding agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.urls]
Repository = "https://github.com/maoxor/ai-assisted-visual-production-playbook"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.uv]
# The tools are standalone scripts (tools/*.py), not an installable package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402"]   # tools and tests insert their folder in sys.path before importing siblings
