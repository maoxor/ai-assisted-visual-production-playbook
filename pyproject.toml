[project]
name = "ai-assisted-visual-production-playbook"
version = "2.0.0"
description = "Method and tested tools for producing 3D renders, animations and web background videos with an AI coding agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.urls]
Repository = "https://github.com/maoxor/ai-assisted-visual-production-playbook"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# The tools are standalone scripts (tools/*.py), not an installable package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
