name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Links, maturity levels, confidentiality and toolkit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structure, internal links, anchors, maturity levels, confidentiality
        run: python scripts/check_repo.py
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Test dependencies
        run: python -m pip install --quiet numpy opencv-python-headless pytest
      - name: Toolkit tests
        run: python -m pytest tools/tests -q
      - name: Sample project creation
        run: |
          python scripts/new_project.py "$RUNNER_TEMP/sample-project" --name "CI sample"
          test -f "$RUNNER_TEMP/sample-project/CLAUDE.md"
          test -f "$RUNNER_TEMP/sample-project/.claude/skills/work-log/SKILL.md"
          python scripts/new_project.py "$RUNNER_TEMP/sample-project" --name "CI sample" | grep -q "kept"
          python "$RUNNER_TEMP/sample-project/tools/fingerprint.py" compute --dep "$RUNNER_TEMP/sample-project/docs/BRIEF.md"
