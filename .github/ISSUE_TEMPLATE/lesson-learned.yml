name: Lesson learned
description: A mistake corrected, a practice that worked, a discovery worth keeping (generic form)
title: "Lesson learned: "
labels: ["lesson-learned"]
body:
  - type: markdown
    attributes:
      value: >
        Describe the lesson in **generic** form: no project, client, artwork or person name, and no figure,
        deliverable or quotation specific to a project (decision 0007).
  - type: textarea
    id: situation
    attributes:
      label: Situation (generic)
      description: The kind of work and the moment when the problem or success appeared.
    validations:
      required: true
  - type: textarea
    id: effect
    attributes:
      label: Effect
      description: Cost, visible defect, time lost, or observed benefit.
  - type: textarea
    id: practice
    attributes:
      label: Fix or practice kept
  - type: textarea
    id: rule
    attributes:
      label: Proposed rule
      description: Where to integrate it (principle, workflow step, checklist, anti-pattern, tool) and at which maturity level.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: No project content, no secret, no personal data
          required: true
        - label: Method, not aesthetic choice
