name: Method change
description: Propose to change a principle, a workflow step, a checklist, a tool or a template
title: "Method change: "
labels: ["method-change"]
body:
  - type: input
    id: target
    attributes:
      label: Document or tool concerned
      placeholder: "e.g. docs/workflow/06-production.md"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why change it
      description: The limit observed with the current practice, described in generic terms.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: dropdown
    id: scope
    attributes:
      label: Scope (version)
      options:
        - "patch: clarification, correction"
        - "minor: step, guide, tool, template or skill added"
        - "major: principle changed, decision replaced, breaking tool change"
    validations:
      required: true
